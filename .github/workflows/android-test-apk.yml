name: Android test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test Android debug APK
        run: ./gradlew assembleFullDebug testFullDebugUnitTest --no-daemon

      - name: Upload APK and test reports
        uses: actions/upload-artifact@v4
        with:
          name: noop-android-test-apk-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/full/debug/*.apk
            android/app/build/test-results/testFullDebugUnitTest/**/*.xml
          if-no-files-found: error
          retention-days: 14
